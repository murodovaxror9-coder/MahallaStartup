# Avtomatik generatsiya: `pnpm contract:build` (marshrutlar + zod sxemalar). Qo'lda tahrirlamang.
openapi: "3.0.3"
info:
  title: "Mahalladosh API"
  version: "0.2.0"
  description: "Avtomatik generatsiya qilingan shartnoma (`pnpm contract:build`): marshrutlar va zod sxemalardan. Xato formati hamma joyda bir xil: `{ error: { code, message, details } }`. Kursorli sahifalash: `?cursor=&limit=` -> `{ items, nextCursor }`."
servers:
  - url: "http://localhost:3000/api/v1"
    description: "Lokal API"
tags:
  - name: "Auth"
  - name: "Bosh sahifa"
  - name: "Muammolar"
  - name: "Ovoz"
  - name: "Admin: davrlar"
  - name: "Media"
  - name: "Chat"
  - name: "Shikoyatlar"
  - name: "Admin: moderatsiya"
  - name: "Tadbirlar"
  - name: "Admin: tadbirlar"
  - name: "E'lonlar"
  - name: "Admin: e'lonlar"
  - name: "Bildirishnomalar"
  - name: "Admin: aholi"
  - name: "Admin: muammolar"
  - name: "Admin"
paths:
  "/health":
    servers:
      - url: "http://localhost:3000"
    get:
      tags:
        - "Tizim"
      summary: "Liveness: jarayon tirik (bog‘liqliklarga qaramaydi)"
      operationId: "getHealth"
      responses:
        "200":
          description: "Tirik"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "status"
                properties:
                  status:
                    type: "string"
                    enum:
                      - "ok"
  "/ready":
    servers:
      - url: "http://localhost:3000"
    get:
      tags:
        - "Tizim"
      summary: "Readiness: DB, kesh va saqlash alohida hisobot qilinadi"
      operationId: "getReady"
      responses:
        "200":
          description: "Hammasi ishlayapti"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Ready"
        "503":
          description: "Kamida bitta bog‘liqlik ishlamayapti"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Ready"
  "/auth/login":
    post:
      tags:
        - "Auth"
      summary: "Kirish (mobil: Bearer token, veb: HttpOnly cookie)"
      description: "Mobil: `{ token, user, mustChangePassword }`. Veb: `Set-Cookie: mhd_session` + `mhd_csrf` va `{ user, mustChangePassword }`. Bitta login uchun 5 ketma-ket xato -> 15 daqiqa blok (429 TOO_MANY_ATTEMPTS)."
      operationId: "postAuthLogin"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                login:
                  type: "string"
                  minLength: 1
                  maxLength: 64
                password:
                  type: "string"
                  minLength: 1
                  maxLength: 200
                client:
                  type: "string"
                  enum:
                    - "mobile"
                    - "web"
              required:
                - "login"
                - "password"
                - "client"
      responses:
        "200":
          description: "Muvaffaqiyatli"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  token:
                    description: "Faqat mobil (client=mobile)"
                    type: "string"
                  user:
                    type: "object"
                    properties:
                      id:
                        type: "string"
                        format: "uuid"
                        pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                      login:
                        type: "string"
                      displayName:
                        type: "string"
                      phone:
                        nullable: true
                        type: "string"
                      role:
                        type: "string"
                        enum:
                          - "RESIDENT"
                          - "MAHALLA_ADMIN"
                      mahalla:
                        type: "object"
                        properties:
                          id:
                            type: "string"
                            format: "uuid"
                            pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                          name:
                            type: "string"
                          slug:
                            type: "string"
                        required:
                          - "id"
                          - "name"
                          - "slug"
                        additionalProperties: false
                    required:
                      - "id"
                      - "login"
                      - "displayName"
                      - "phone"
                      - "role"
                      - "mahalla"
                    additionalProperties: false
                  mustChangePassword:
                    type: "boolean"
                required:
                  - "user"
                  - "mustChangePassword"
                additionalProperties: false
        "400":
          description: "VALIDATION_ERROR: so'rov noto'g'ri (details.fields)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED / TOO_MANY_ATTEMPTS (Retry-After header)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security: []
      "x-role": "public"
  "/auth/logout":
    post:
      tags:
        - "Auth"
      summary: "Chiqish (joriy sessiyani bekor qiladi)"
      operationId: "postAuthLogout"
      responses:
        "204":
          description: "Muvaffaqiyatli (javob tanasi yo'q)"
        "401":
          description: "UNAUTHENTICATED: sessiya yo‘q yoki bekor qilingan"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "FORBIDDEN / PASSWORD_CHANGE_REQUIRED / CSRF_INVALID"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED / TOO_MANY_ATTEMPTS (Retry-After header)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
      "x-role": "user"
  "/auth/change-password":
    post:
      tags:
        - "Auth"
      summary: "Parolni almashtirish (joriy sessiyadan boshqalari bekor qilinadi)"
      operationId: "postAuthChangePassword"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                currentPassword:
                  type: "string"
                  minLength: 1
                  maxLength: 200
                newPassword:
                  type: "string"
                  minLength: 8
                  maxLength: 200
              required:
                - "currentPassword"
                - "newPassword"
      responses:
        "204":
          description: "Muvaffaqiyatli (javob tanasi yo'q)"
        "400":
          description: "VALIDATION_ERROR: so'rov noto'g'ri (details.fields)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "UNAUTHENTICATED: sessiya yo‘q yoki bekor qilingan"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "FORBIDDEN / PASSWORD_CHANGE_REQUIRED / CSRF_INVALID"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED / TOO_MANY_ATTEMPTS (Retry-After header)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
      "x-role": "user"
  "/me":
    get:
      tags:
        - "Auth"
      summary: "Joriy foydalanuvchi"
      operationId: "getMe"
      responses:
        "200":
          description: "Muvaffaqiyatli"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  user:
                    type: "object"
                    properties:
                      id:
                        type: "string"
                        format: "uuid"
                        pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                      login:
                        type: "string"
                      displayName:
                        type: "string"
                      phone:
                        nullable: true
                        type: "string"
                      role:
                        type: "string"
                        enum:
                          - "RESIDENT"
                          - "MAHALLA_ADMIN"
                      mahalla:
                        type: "object"
                        properties:
                          id:
                            type: "string"
                            format: "uuid"
                            pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                          name:
                            type: "string"
                          slug:
                            type: "string"
                        required:
                          - "id"
                          - "name"
                          - "slug"
                        additionalProperties: false
                    required:
                      - "id"
                      - "login"
                      - "displayName"
                      - "phone"
                      - "role"
                      - "mahalla"
                    additionalProperties: false
                  mahalla:
                    type: "object"
                    properties:
                      id:
                        type: "string"
                        format: "uuid"
                        pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                      name:
                        type: "string"
                      slug:
                        type: "string"
                    required:
                      - "id"
                      - "name"
                      - "slug"
                    additionalProperties: false
                  role:
                    type: "string"
                    enum:
                      - "RESIDENT"
                      - "MAHALLA_ADMIN"
                  mustChangePassword:
                    type: "boolean"
                  unreadNotifications:
                    type: "integer"
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - "user"
                  - "mahalla"
                  - "role"
                  - "mustChangePassword"
                  - "unreadNotifications"
                additionalProperties: false
        "401":
          description: "UNAUTHENTICATED: sessiya yo‘q yoki bekor qilingan"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "FORBIDDEN / PASSWORD_CHANGE_REQUIRED / CSRF_INVALID"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED / TOO_MANY_ATTEMPTS (Retry-After header)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
      "x-role": "user"
  "/devices":
    put:
      tags:
        - "Auth"
      summary: "Push token'ni ro'yxatdan o'tkazish (idempotent)"
      operationId: "putDevices"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                expoPushToken:
                  type: "string"
                  minLength: 10
                  maxLength: 200
                platform:
                  type: "string"
                  enum:
                    - "ios"
                    - "android"
              required:
                - "expoPushToken"
                - "platform"
      responses:
        "204":
          description: "Muvaffaqiyatli (javob tanasi yo'q)"
        "400":
          description: "VALIDATION_ERROR: so'rov noto'g'ri (details.fields)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "UNAUTHENTICATED: sessiya yo‘q yoki bekor qilingan"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "FORBIDDEN / PASSWORD_CHANGE_REQUIRED / CSRF_INVALID"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED / TOO_MANY_ATTEMPTS (Retry-After header)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
      "x-role": "user"
  "/devices/{token}":
    delete:
      tags:
        - "Auth"
      summary: "Push token'ni o'chirish"
      operationId: "deleteDevicesByToken"
      parameters:
        - name: "token"
          in: "path"
          required: true
          schema:
            type: "string"
            minLength: 10
            maxLength: 200
      responses:
        "204":
          description: "Muvaffaqiyatli (javob tanasi yo'q)"
        "400":
          description: "VALIDATION_ERROR: so'rov noto'g'ri (details.fields)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "401":
          description: "UNAUTHENTICATED: sessiya yo‘q yoki bekor qilingan"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "FORBIDDEN / PASSWORD_CHANGE_REQUIRED / CSRF_INVALID"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "404":
          description: "NOT_FOUND: topilmadi (boshqa mahalla obyekti ham shunday)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED / TOO_MANY_ATTEMPTS (Retry-After header)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
      "x-role": "user"
  "/home":
    get:
      tags:
        - "Bosh sahifa"
      summary: "Mobil bosh sahifa: bitta so'rovda hammasi"
      description: "Mahalla bo'yicha umumiy qism 10 s keshlanadi; ovozlar va o'qilmaganlar foydalanuvchiga xos."
      operationId: "getHome"
      responses:
        "200":
          description: "Muvaffaqiyatli"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  round:
                    type: "object"
                    properties:
                      periodEnd:
                        type: "string"
                        format: "date-time"
                        pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$"
                      votesLeft:
                        type: "integer"
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                    required:
                      - "periodEnd"
                      - "votesLeft"
                    additionalProperties: false
                  featuredIssue:
                    nullable: true
                    type: "object"
                    properties:
                      id:
                        type: "string"
                        format: "uuid"
                        pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                      title:
                        type: "string"
                      status:
                        type: "string"
                      statusLabel:
                        type: "string"
                    required:
                      - "id"
                      - "title"
                      - "status"
                      - "statusLabel"
                    additionalProperties: false
                  nextEvent:
                    nullable: true
                    type: "object"
                    properties:
                      id:
                        type: "string"
                        format: "uuid"
                        pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                      title:
                        type: "string"
                      startsAt:
                        type: "string"
                        format: "date-time"
                        pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$"
                      location:
                        type: "string"
                    required:
                      - "id"
                      - "title"
                      - "startsAt"
                      - "location"
                    additionalProperties: false
                  latestImportantAnnouncement:
                    nullable: true
                    type: "object"
                    properties:
                      id:
                        type: "string"
                        format: "uuid"
                        pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                      title:
                        type: "string"
                      publishedAt:
                        nullable: true
                        type: "string"
                        format: "date-time"
                        pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$"
                    required:
                      - "id"
                      - "title"
                      - "publishedAt"
                    additionalProperties: false
                  unreadNotifications:
                    type: "integer"
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                required:
                  - "round"
                  - "featuredIssue"
                  - "nextEvent"
                  - "latestImportantAnnouncement"
                  - "unreadNotifications"
                additionalProperties: false
        "401":
          description: "UNAUTHENTICATED: sessiya yo‘q yoki bekor qilingan"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "FORBIDDEN / PASSWORD_CHANGE_REQUIRED / CSRF_INVALID"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED / TOO_MANY_ATTEMPTS (Retry-After header)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
      "x-role": "resident"
  "/categories":
    get:
      tags:
        - "Muammolar"
      summary: "Toifalar (o'zbekcha nomlari bilan)"
      operationId: "getCategories"
      responses:
        "200":
          description: "Muvaffaqiyatli"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        value:
                          type: "string"
                        label:
                          type: "string"
                      required:
                        - "value"
                        - "label"
                      additionalProperties: false
                required:
                  - "items"
                additionalProperties: false
        "401":
          description: "UNAUTHENTICATED: sessiya yo‘q yoki bekor qilingan"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "403":
          description: "FORBIDDEN / PASSWORD_CHANGE_REQUIRED / CSRF_INVALID"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        "429":
          description: "RATE_LIMITED / TOO_MANY_ATTEMPTS (Retry-After header)"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
        - bearerAuth: []
        - cookieAuth: []
      "x-role": "user"
  "/issues/mine":
    get:
      tags:
        - "Muammolar"
      summary: "Mening muammolarim (hamma holatda, rad sababi va dublikat bilan)"
      operationId: "getIssuesMine"
      parameters:
        - name: "cursor"
          in: "query"
          required: false
          schema:
            type: "string"
            maxLength: 500
        - name: "limit"
          in: "query"
          required: false
          schema:
            default: 20
            type: "integer"
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: "Muvaffaqiyatli"
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  items:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          format: "uuid"
                          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
                        title:
                          type: "string"
                        category:
                          type: "string"
                        categoryLabel:
                          type: "string"
                        locationText:
                          type: "string"
                        status:
                          type: "string"
                        statusLabel:
                          type: "string"
                        publishedAt:
                          nullable: true
                          type: "string"
                          format: "date-time"
                          pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$"
                        createdAt:
                          type: "string"
                          format: "date-time"
                          pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z))$"
                        commentCount:
                          type: "integer"
                          minimum: -9007199254740991
