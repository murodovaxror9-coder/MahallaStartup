# IXTIYORIY infratuzilma (production'ga o'xshash): Postgres + Redis + MinIO. Backend uchun SHART EMAS —
# lokal rejimda ichki Postgres (PGlite), xotiradagi kesh va fayl saqlash ishlaydi. Docker'siz variantlar: README.
# Ishga tushirgach .env ga yozing:
#   DATABASE_URL=postgresql://mahalladosh:mahalladosh@localhost:5432/mahalladosh
#   REDIS_URL=redis://localhost:6379
#   S3_ENDPOINT=http://localhost:9000  S3_BUCKET=mahalladosh-media  S3_ACCESS_KEY=mahalladosh  S3_SECRET_KEY=mahalladosh-secret  S3_FORCE_PATH_STYLE=true
name: mahalladosh

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mahalladosh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mahalladosh}
      POSTGRES_DB: ${POSTGRES_DB:-mahalladosh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mahalladosh}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-mahalladosh-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mahalladosh}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mahalladosh-secret}
      S3_BUCKET: ${S3_BUCKET:-mahalladosh-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      mc anonymous set none local/$$S3_BUCKET &&
      echo 'bucket tayyor'
      "
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
